<!DOCTYPE html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>DevBurguer</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <header>
            <section>
                <h1>🍔 DevBuguer</h1>
                <p>O hambúrguer favorito dos programadores!</p>
                <p>Aberto todos os dias das 18h às 23h.</p>
            </section>

            <a href="#cardapio">Ver cardápio</a>
        </header>

        <main>
            <!--
            LISTA NÃO ORDENADA

            <ul> significa unordered list, ou lista não ordenada.
            
            Utilizamos esse tipo de lista quando a ordem dos itens não é importante.

            Cada item da lista é criado com a tag <li>
            -->
            <section>
                <h2>Nossos diferenciais</h2>

                <ul>
                    <li>Hambúrguer artesanal</li>
                    <li>Pão feito diariamente</li>
                    <li>Ingredientes selecionados</li>
                    <li>Entrega rápida</li>
                    <li>Opções vegetarianas</li>
                </ul>
            </section>
        </main>
    </body>
</html>
